Global Configuration
global
    log stdout format raw local0 info
    maxconn 20000
    tune.ssl.default-dh-param 2048
    
    # HTTP/2 tuning (affects frontends with h2)
    tune.h2.initial-window-size 65535
    tune.h2.max-concurrent-streams 1000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor except 127.0.0.0/8
    option  http-server-close
    retries 3
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    stats show-node
    stats auth admin:admin123

frontend https_front
    bind *:443 ssl crt /etc/haproxy/certs/server.pem alpn h2,http/1.1
    mode http
    option httplog
    default_backend app_backend

frontend http_front
    bind *:80
    mode http
    redirect scheme https code 301

backend app_backend
    mode http
    balance roundrobin
    option http-no-delay
    
    # Health check using HTTP/1.1 (must be supported by Node.js)
    option httpchk GET /health
    http-check expect status 200
    
    # Forward headers
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-For %[src]
    
    # Add backend header
    http-response add-header X-Backend-Server %s
    
    # Node.js servers (HTTP/1.1 health check)
    server app1 analytics-app1:4002 check inter 2s rise 2 fall 3 maxconn 5000
    server app2 analytics-app2:4002 check inter 2s rise 2 fall 3 maxconn 5000
    server app3 analytics-app3:4002 check inter 2s rise 2 fall 3 maxconn 5000


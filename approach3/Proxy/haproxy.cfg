# ============================================
# HAProxy Configuration for Real-Time Analytics
# Optimized for HTTP/2 + SSE Streaming
# ============================================

global
    log stdout format raw local0 info
    maxconn 20000
    tune.ssl.default-dh-param 2048
    
    # HTTP/2 optimizations
    tune.h2.initial-window-size 65535
    tune.h2.max-concurrent-streams 1000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    retries 3
    
    # Long timeouts for SSE streams
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h

# ============================================
# Stats Dashboard
# Access: http://localhost:8404
# ============================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    stats show-node
    stats auth admin:admin123

# ============================================
# Frontend: HTTPS/HTTP2 (Main Entry)
# ============================================
frontend https_front
    bind *:443 ssl crt /etc/haproxy/certs/server.pem alpn h2,http/1.1
    mode http
    option httplog
    
    default_backend app_backend

# ============================================
# Frontend: HTTP (Redirect to HTTPS)
# ============================================
frontend http_front
    bind *:80
    mode http
    
    # Redirect HTTP to HTTPS
    redirect scheme https code 301

# ============================================
# Backend: Node.js App Instances
# ============================================
backend app_backend
    mode http
    balance roundrobin
    option http-no-delay
    
    # Health checks via HTTP (not HTTPS to avoid SSL issues)
    option httpchk GET /health
    http-check expect status 200
    
    # Forward headers
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-For %[src]
    
    # Add response header with backend server name
    http-response add-header X-Backend-Server %s
    
    # Server definitions - using direct HTTP connections for health checks
    server app1 analytics-app1:4002 check inter 2s rise 2 fall 3 maxconn 5000
    server app2 analytics-app2:4002 check inter 2s rise 2 fall 3 maxconn 5000
    server app3 analytics-app3:4002 check inter 2s rise 2 fall 3 maxconn 5000

# ============================================
# Notes:
# - roundrobin: distributes requests evenly
# - maxconn 5000: each instance can handle 5000 concurrent connections
# - timeout 1h: necessary for long-lived SSE connections
# - alpn h2: enables HTTP/2 negotiation
# ============================================

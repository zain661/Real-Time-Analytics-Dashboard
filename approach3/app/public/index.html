<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Approach3 Dashboard</title>
  <script type="module">
    import { io } from "https://cdn.socket.io/4.7.2/socket.io.esm.min.js";
    const socket = io("https://localhost:4003", { transports: ["websocket"] });
    socket.on("metric_update", data => {
      const out = document.getElementById('out');
      out.textContent += JSON.stringify(data) + '\n';
    });
  </script>
</head>

<body>
  <h1>Approach3 Real-time</h1>
  <pre id="out"></pre>
</body>

</html>

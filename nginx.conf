# Nginx Load Balancer Configuration for HTTP/2 Streaming
# This configuration sits in front of multiple Node.js servers

# PID file location
pid C:/nginx-1.29.3/logs/nginx.pid;

events {
    worker_connections 10000;  # Handle 10,000 concurrent connections
}

http {
    # Logging (using absolute paths relative to nginx root)
    access_log C:/nginx-1.29.3/logs/access.log;
    error_log C:/nginx-1.29.3/logs/error.log;
    # Upstream backend servers - Load Balancing
    upstream backend_servers {
        # Load balancing method: least_conn (least connections)
        # least_conn;
        
        # # Backend servers (you can scale these)
        # server node1:4002 max_fails=3 fail_timeout=30s;
        # server node2:4002 max_fails=3 fail_timeout=30s;
        # server node3:4002 max_fails=3 fail_timeout=30s;
        least_conn;
        server 127.0.0.1:4002 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:4003 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:4004 max_fails=3 fail_timeout=30s;
    }

    # HTTP/2 Server Block
    server {
        listen 8443 ssl;  # Nginx accepts HTTP/2 on port 8443
        http2 on;  # Enable HTTP/2 (new syntax)
        server_name localhost;

        # SSL Configuration (using self-signed certs)
        ssl_certificate "C:/nginx-1.29.3/ssl/my-cert.pem";
        ssl_certificate_key "C:/nginx-1.29.3/ssl/my-key.pem";

        ssl_protocols TLSv1.2 TLSv1.3;
        
        # Allow self-signed certificates
        ssl_verify_client off;

        # Increase timeouts for long-lived connections
        proxy_read_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_buffering off;  # Critical for streaming!

        # HTTP/2 specific settings (using modern syntax)
        large_client_header_buffers 4 64k;

        # ============================================
        # Metric Streaming Endpoint (POST)
        # ============================================
        location /api/metrics/stream {
            proxy_pass http://backend_servers;
            
            # HTTP/2 proxy settings
            proxy_http_version 2.0;  # Nginx converts HTTP/2 to HTTP/1.1 upstream
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Preserve headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Custom headers
            proxy_set_header X-Server-Id $http_x_server_id;
            proxy_set_header Content-Type $http_content_type;
            
            # Buffering settings for streaming
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            
            # Keep connections alive
            proxy_set_header Connection "";
        }

        # ============================================
        # Dashboard SSE Endpoint (GET)
        # ============================================
        location /api/dashboard/stream {
            proxy_pass http://backend_servers;
            
            # SSE specific settings
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            
            # Required for SSE
            proxy_set_header Cache-Control 'no-cache';
            proxy_set_header X-Accel-Buffering 'no';
            
            # Preserve headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Keep connection alive
            proxy_read_timeout 3600s;
            proxy_set_header Connection "";
        }

        # ============================================
        # Statistics Endpoint (GET)
        # ============================================
        location /api/stats {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_buffering off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /nginx_status {
        stub_status;
        allow 127.0.0.1;   # or your IP
        deny all;
        }

        # ============================================
        # Health Check (GET)
        # ============================================
        location /health {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
        }

        # ============================================
        # Dashboard HTML and Static Files
        # ============================================
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}


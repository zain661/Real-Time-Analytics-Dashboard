# Nginx Load Balancer Configuration for HTTP/2 Streaming
# Extended configuration with MORE backend servers for testing

# PID file location
pid C:/nginx-1.29.3/logs/nginx.pid;

events {
    worker_connections 50000;  # High scale: 10,000 servers + 500 viewers
    use epoll;  # Better performance on Linux (ignored on Windows)
}

http {
    # Logging
    access_log C:/nginx-1.29.3/logs/access.log;
    error_log C:/nginx-1.29.3/logs/error.log;
    
    # Upstream backend servers - Load Balancing with MORE servers
    upstream backend_servers {
        least_conn;
        # 3 servers (original)
        server 127.0.0.1:4002 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:4003 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:4004 max_fails=3 fail_timeout=30s;
        
        # Additional servers for testing
        server 127.0.0.1:4005 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:4006 max_fails=3 fail_timeout=30s;
        
        # Uncomment for even more servers (if needed)
        # server 127.0.0.1:4007 max_fails=3 fail_timeout=30s;
        # server 127.0.0.1:4008 max_fails=3 fail_timeout=30s;
    }

    # HTTP/2 Server Block
    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        # SSL Configuration
        ssl_certificate "C:/nginx-1.29.3/ssl/my-cert.pem";
        ssl_certificate_key "C:/nginx-1.29.3/ssl/my-key.pem";

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_verify_client off;

        # Increase timeouts for long-lived connections (high scale)
        proxy_read_timeout 3600s;
        proxy_connect_timeout 120s;  # Increased for high load
        proxy_send_timeout 3600s;
        proxy_buffering off;
        
        # Connection pool settings for high concurrency
        proxy_http_version 1.1;
        keepalive_timeout 3600s;
        keepalive_requests 100000;

        # HTTP/2 specific settings
        large_client_header_buffers 4 64k;

        # Increase connection pool
        keepalive_requests 10000;
        keepalive_timeout 3600s;

        # ============================================
        # Metric Streaming Endpoint (POST)
        # ============================================
        location /api/metrics/stream {
            proxy_pass https://backend_servers;
            
            # HTTP/2 proxy settings (still HTTP/1.1 upstream - nginx limitation)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Preserve headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Custom headers
            proxy_set_header X-Server-Id $http_x_server_id;
            proxy_set_header Content-Type $http_content_type;
            
            # Buffering settings for streaming
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            
            # Keep connections alive (important for connection pooling)
            proxy_set_header Connection "";
            
            # Connection pool settings
            proxy_set_header Connection "keep-alive";
            keepalive_requests 10000;
            keepalive_timeout 3600s;
        }

        # ============================================
        # Dashboard SSE Endpoint (GET)
        # ============================================
        location /api/dashboard/stream {
            proxy_pass https://backend_servers;
            
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            
            proxy_set_header Cache-Control 'no-cache';
            proxy_set_header X-Accel-Buffering 'no';
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_read_timeout 3600s;
            proxy_set_header Connection "";
        }

        # ============================================
        # Statistics Endpoint (GET)
        # ============================================
        location /api/stats {
            proxy_pass https://backend_servers;
            proxy_http_version 1.1;
            proxy_buffering off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============================================
        # Health Check (GET)
        # ============================================
        location /health {
            proxy_pass https://backend_servers;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
        }

        # ============================================
        # Dashboard HTML and Static Files
        # ============================================
        location / {
            proxy_pass https://backend_servers;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

